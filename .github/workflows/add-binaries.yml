name: Add binary assets
on:
  workflow_dispatch:
  push:
    paths:
      - "staging/**"
permissions:
  contents: write
jobs:
  decode-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble, decode binaries and commit
        run: |
          set -euo pipefail
          mkdir -p staging
          # Known one-char paste fixes for staging parts
          if [ -f staging/parts/pdf_011.txt ]; then
            python3 - <<'PY'
          from pathlib import Path
          p = Path('staging/parts/pdf_011.txt')
          t = p.read_text()
          t2 = t.replace('xhvFepaNS', 'xhvFEpaNS', 1)
          if t != t2:
              p.write_text(t2)
              print('patched pdf_011 Fepa->FEpa')
          PY
          fi
          if ls staging/parts/pdf_[0-9][0-9][0-9].txt >/dev/null 2>&1; then
            cat $(ls staging/parts/pdf_[0-9][0-9][0-9].txt | sort) > staging/model-architecture.pdf.b64
          fi
          if ls staging/parts/png_[0-9][0-9][0-9].txt >/dev/null 2>&1; then
            cat $(ls staging/parts/png_[0-9][0-9][0-9].txt | sort) > staging/architecture-diagram.png.b64
          fi
          if [ ! -f staging/architecture-diagram.png.b64 ] || [ ! -f staging/model-architecture.pdf.b64 ]; then
            echo "Staging b64 files missing; nothing to do"
            exit 0
          fi
          PDF_LEN=$(wc -c < staging/model-architecture.pdf.b64 | tr -d ' ')
          PNG_LEN=$(wc -c < staging/architecture-diagram.png.b64 | tr -d ' ')
          echo "PDF b64 len=$PDF_LEN PNG b64 len=$PNG_LEN"
          if [ "$PDF_LEN" -lt 80000 ] || [ "$PNG_LEN" -lt 240000 ]; then
            echo "Incomplete staging payloads; waiting for more parts"
            exit 0
          fi
          # Integrity checks (md5 of expected local b64)
          PDF_MD5=$(md5sum staging/model-architecture.pdf.b64 | awk '{print $1}')
          PNG_MD5=$(md5sum staging/architecture-diagram.png.b64 | awk '{print $1}')
          echo "PDF md5=$PDF_MD5 PNG md5=$PNG_MD5"
          test "$PDF_MD5" = "$(python3 -c 'import hashlib,pathlib; print(hashlib.md5(pathlib.Path("staging/model-architecture.pdf.b64").read_bytes()).hexdigest())')"
          EXPECT_PDF_MD5=$(cat staging/EXPECTED_PDF_B64_MD5 2>/dev/null || true)
          EXPECT_PNG_MD5=$(cat staging/EXPECTED_PNG_B64_MD5 2>/dev/null || true)
          if [ -n "$EXPECT_PDF_MD5" ] && [ "$PDF_MD5" != "$EXPECT_PDF_MD5" ]; then
            echo "PDF b64 md5 mismatch: got $PDF_MD5 want $EXPECT_PDF_MD5"
            exit 1
          fi
          if [ -n "$EXPECT_PNG_MD5" ] && [ "$PNG_MD5" != "$EXPECT_PNG_MD5" ]; then
            echo "PNG b64 md5 mismatch: got $PNG_MD5 want $EXPECT_PNG_MD5"
            exit 1
          fi
          base64 -d staging/architecture-diagram.png.b64 > architecture-diagram.png
          base64 -d staging/model-architecture.pdf.b64 > model-architecture.pdf
          file architecture-diagram.png model-architecture.pdf || true
          head -c 8 architecture-diagram.png | od -An -tx1
          head -c 5 model-architecture.pdf | od -An -tx1
          # Size sanity
          test $(wc -c < architecture-diagram.png | tr -d ' ') -eq 187067
          test $(wc -c < model-architecture.pdf | tr -d ' ') -eq 63162
          rm -rf staging
          rm -f .github/workflows/add-binaries.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "Add architecture diagram and PDF"
          git push
